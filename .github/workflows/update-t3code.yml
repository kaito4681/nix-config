name: Update T3 Code

on:
  schedule:
    # Every six hours, away from the top of the hour.
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-t3code
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      number: ${{ steps.pr.outputs.pull-request-number }}
      sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Fetch and verify official stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/t3code/update.py
      - name: Create or refresh update PR
        if: steps.release.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/update-t3code
          commit-message: 'chore(t3code): update to ${{ steps.release.outputs.version }}'
          title: 'chore(t3code): update to ${{ steps.release.outputs.version }}'
          body-path: ${{ steps.release.outputs.body-path }}
          add-paths: pkgs/t3code/release.json

  # Explicit invocation avoids depending on PR events generated by GITHUB_TOKEN.
  check-update:
    needs: update
    if: needs.update.outputs.number != '' && needs.update.outputs.sha != ''
    uses: ./.github/workflows/check.yml
    secrets: inherit
    with:
      ref: ${{ needs.update.outputs.sha }}

  verify-package:
    needs: update
    if: needs.update.outputs.number != '' && needs.update.outputs.sha != ''
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.update.outputs.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          github_access_token: ${{ github.token }}
      - name: Verify CLI, managed privacy policy, and signature
        run: |
          nix build --no-update-lock-file path:.#t3code
          ./result/bin/t3 --version
          nix eval --impure --json --expr 'import ./modules/t3code-policy.nix' > "$RUNNER_TEMP/t3code-policy.json"
          ./result/bin/t3 policy check "$RUNNER_TEMP/t3code-policy.json"
          if [[ "$RUNNER_OS" == macOS ]]; then
            codesign --verify --deep --strict 'result/Applications/T3 Code (Beta).app'
          fi

  merge:
    needs: [update, check-update, verify-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge only the verified update commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.update.outputs.number }}
          EXPECTED_SHA: ${{ needs.update.outputs.sha }}
        run: gh pr merge "$PR_NUMBER" --squash --match-head-commit "$EXPECTED_SHA" --delete-branch
