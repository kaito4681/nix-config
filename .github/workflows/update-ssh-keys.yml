name: Update GitHub SSH keys

on:
  schedule:
    # 毎日 06:17 JST。混雑する毎時 00 分を避ける。
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-ssh-keys
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.keys.outputs.changed }}
      sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          github_access_token: ${{ github.token }}
      - name: Fetch and validate SSH public keys
        id: keys
        run: python3 ci/ssh-keys/update.py
      - name: Create or update pull request
        if: steps.keys.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/update-ssh-keys
          commit-message: 'chore(ssh): update GitHub public keys'
          title: 'chore(ssh): update GitHub public keys'
          body-path: ${{ steps.keys.outputs.body-path }}
          add-paths: settings.nix

  # GITHUB_TOKEN で作成した PR のイベント発火に依存せず、更新内容を検証する。
  check-updated-keys:
    needs: update
    if: needs.update.outputs.changed == 'true' && needs.update.outputs.sha != ''
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
