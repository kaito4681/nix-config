name: Nix checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  other:
    uses: ./.github/workflows/other.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          github_access_token: ${{ github.token }}
      - name: Check flake
        run: nix flake check --all-systems --no-build --no-update-lock-file path:.
      - name: Discover all configurations
        id: matrix
        run: |
          matrix=$(nix eval --json --impure --expr 'import ./ci/nix/matrix.nix { flake = builtins.getFlake ("path:" + toString ./.); }')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  build:
    needs: evaluate
    name: Build ${{ matrix.kind }}/${{ matrix.name }} (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.evaluate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          github_access_token: ${{ github.token }}
      - name: Build configuration without activating
        env:
          TARGET: ${{ matrix.target }}
        run: nix build --no-link --print-build-logs --no-update-lock-file "path:.#$TARGET"
